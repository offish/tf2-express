{% extends "base.html" %}

{% block title %}
Inventory
{% endblock %}

{% block contents %}
<h1 class="text-3xl font-bold text-white mb-6">Inventory</h1>

<p class="text-gray-400 mb-6">
    Showing {{ inventory.inventory | length }} items in your inventory.
</p>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    {% for item in inventory.inventory %}
    <div class="bg-secondary rounded-lg shadow-lg p-4 flex flex-col justify-between hover:ring-2 hover:ring-primary transition">
        <div class="flex items-center space-x-4">
            <img
                src="https://community.fastly.steamstatic.com/economy/image/{{ item.icon_url }}"
                class="w-16 h-16 rounded bg-black/20 p-1"
                alt="{{ item.market_hash_name }}"
            >
            <div>
                <h3 class="text-lg font-semibold text-white leading-tight">
                    {{ item.market_hash_name }}
                </h3>
                <p class="text-sm text-gray-400">
                    SKU: <span class="text-gray-200 font-medium">{{ item.sku }}</span>
                </p>
            </div>
        </div>
        <div class="mt-4">
            <a
                href="/prices/{{ item.sku }}"
                class="inline-block w-full text-center bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded font-semibold transition"
            >
                Get Prices
            </a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
